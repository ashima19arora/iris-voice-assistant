<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris Voice Orb</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="iris-popup-card">
    <header class="popup-header">
      <div class="brand">
        <div class="orb-pulse-mini"></div>
        <span class="logo-text">IRIS<span class="dot">.</span></span>
      </div>
      <div class="status-badge" id="statusBadge">READY</div>
    </header>

    <div class="perm-banner" id="permBanner" style="display: none;">
      <span>Microphone permission needed.</span>
      <button id="grantPermBtn" class="perm-btn">Allow Mic</button>
    </div>

    <div class="orb-center-container">
      <div class="orb-visualizer" id="mainOrb">
        <div class="orb-glow"></div>
        <div class="orb-core">
          <svg viewBox="0 0 24 24" class="mic-icon" id="micIcon">
            <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </div>
      </div>
      <p class="instruction" id="orbInstruction">Click Orb to Listen</p>
    </div>

    <form class="command-form" id="commandForm">
      <input type="text" class="command-input" id="commandInput" placeholder="Speak or type command..." autocomplete="off" />
      <button type="submit" class="command-send-btn" title="Send">➤</button>
    </form>

    <div class="transcript-box" id="transcriptBox">
      <span class="label">RESPONSE:</span>
      <p class="transcript-text" id="transcriptText">Say "Scroll down", "Click button", or "Read page"...</p>
    </div>

    <div class="quick-actions">
      <div class="section-title">QUICK BROWSER ACTIONS</div>
      <div class="chips">
        <button class="chip" data-cmd="read page">🔊 Read Page</button>
        <button class="chip" data-cmd="scroll down">📜 Scroll Down</button>
        <button class="chip" data-cmd="take screenshot">📸 Screenshot</button>
        <button class="chip" data-cmd="highlight links">🔗 Mark Links</button>
      </div>
    </div>

    <footer class="popup-footer">
      <div class="shortcut-tip">Shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Space</kbd></div>
      <a href="#" id="toggleFloatingOrbBtn" class="link-btn">Toggle Floating Orb</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
